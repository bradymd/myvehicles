# codemagic.yaml — MyVehicles Flutter iOS CI/CD
# Builds the iOS app and publishes to TestFlight via App Store Connect.
#
# Required environment variables (configure in Codemagic dashboard):
#   APP_STORE_CONNECT_ISSUER_ID    — Issuer ID from App Store Connect > Keys
#   APP_STORE_CONNECT_KEY_IDENTIFIER — Key ID of your API key
#   APP_STORE_CONNECT_PRIVATE_KEY  — Contents of the .p8 private key file
#   CERTIFICATE_PRIVATE_KEY        — Private key used to generate the certificate
#   APP_APPLE_ID                   — Your app's Apple ID (numeric, from App Store Connect)
#
# Optional:
#   DVLA_API_KEY                   — DVLA Vehicle Enquiry Service API key
#   SLACK_WEBHOOK_URL              — Slack incoming webhook for build notifications

workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic

    environment:
      # Pinned to the version we develop/analyze against so CI results are
      # reproducible. `stable` floats and can introduce new lints/breakage
      # without warning. Bump deliberately when upgrading Flutter locally.
      flutter: 3.38.9
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.bradymd.myvehicles"

    triggering:
      events: []

    scripts:
      # ── Code signing ──────────────────────────────────────────────
      - name: Set up code signing
        script: |
          # Fetch or create provisioning profile + certificate
          app-store-connect fetch-signing-files "com.bradymd.myvehicles" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create

          # Set up keychain with the certificates
          keychain initialize
          app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --save
          keychain add-certificates

      # ── Dependencies ──────────────────────────────────────────────
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      # ── Quality checks ────────────────────────────────────────────
      - name: Flutter analyze
        script: |
          flutter analyze

      - name: Run unit tests
        script: |
          flutter test
        ignore_failure: true

      # ── Build ─────────────────────────────────────────────────────
      - name: Build IPA
        script: |
          # Apply the fetched provisioning profiles to the Xcode project
          # immediately before archiving (canonical Codemagic ordering).
          echo "--- provisioning profiles on runner ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || true
          xcode-project use-profiles
          BUILD_NUMBER=$(date +%s)
          echo "Using build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=DVLA_API_KEY=$DVLA_API_KEY \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - brady@bradymd.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        apple_id: $APP_APPLE_ID
        submit_to_testflight: true
        expire_build_submitted_for_review: true
        submit_to_app_store: false
