# codemagic.yaml — MyVehicles Flutter iOS CI/CD
# Builds the iOS app and publishes to TestFlight via App Store Connect.
#
# Required environment variables (configure in Codemagic dashboard):
#   APP_STORE_CONNECT_ISSUER_ID    — Issuer ID from App Store Connect > Keys
#   APP_STORE_CONNECT_KEY_IDENTIFIER — Key ID of your API key
#   APP_STORE_CONNECT_PRIVATE_KEY  — Contents of the .p8 private key file
#   CERTIFICATE_PRIVATE_KEY        — Private key used to generate the certificate
#   APP_APPLE_ID                   — Your app's Apple ID (numeric, from App Store Connect)
#
# Optional:
#   SLACK_WEBHOOK_URL              — Slack incoming webhook for build notifications

workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.bradymd.myvehicles"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      # ── Code signing ──────────────────────────────────────────────
      - name: Set up code signing
        script: |
          set -e
          set -x

          # Generate a private key for certificate creation
          openssl genrsa -out /tmp/cert_key.pem 2048

          # Fetch or create provisioning profile + certificate
          app-store-connect fetch-signing-files "com.bradymd.myvehicles" \
            --type IOS_APP_STORE \
            --certificate-key=/tmp/cert_key.pem \
            --create

          # Debug: check what profiles were downloaded
          echo "=== Downloaded profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No profiles directory"

          # Set up keychain with the certificates
          keychain initialize
          app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --certificate-key=/tmp/cert_key.pem \
            --save
          keychain add-certificates

          # Debug: check keychain
          echo "=== Keychain certificates ==="
          security find-identity -v -p codesigning

          # Apply profiles to Xcode project
          xcode-project use-profiles

      # ── Dependencies ──────────────────────────────────────────────
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Install CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;

      # ── Quality checks ────────────────────────────────────────────
      - name: Flutter analyze
        script: |
          flutter analyze

      - name: Run unit tests
        script: |
          flutter test
        ignore_failure: true

      # ── Build ─────────────────────────────────────────────────────
      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" 2>/dev/null || echo "0")
          BUILD_NUMBER=$((LATEST + 1))
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - brady@bradymd.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
        submit_to_app_store: false
